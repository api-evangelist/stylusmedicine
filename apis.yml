name: Stylus Medicine
description: Stylus Medicine is a Cambridge, Massachusetts biotechnology company developing
  in vivo genetic medicines built on engineered recombinases. Its platform aims to generate
  precise, durable CAR-T cells directly inside the body using cell-targeted lipid nanoparticle
  delivery to immune cells, with therapeutic programs spanning oncology, autoimmune disease,
  and genetic disorders. The company is a portfolio company of Khosla Ventures. It operates
  as a research-stage therapeutics company and does not currently publish a public developer
  API, SDK, or documentation surface.
